<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimorio de Jesús</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="particles-container"></div>

    <div class="grimorio-container">
        <header>
            <div class="clover-header">♣</div>
            <h1>Grimorio de Jesús</h1>
            <p class="subtitle">Orden de los Toros Negros</p>
        </header>

        <section class="page-content">
            <div class="photo-frame">
    <img src="trebol.png" class="clover-img" alt="Trébol 5 Hojas">
    
    <div class="squad-badge">
        <img src="escudo.png" alt="Black Bulls">
    </div>
</div>
            <h2 id="title">Magia de Antigravedad</h2>
            <p id="message">"Jesús, en este reino y en cualquier otro, mi magia siempre te elegirá a ti. ¡Superemos los límites juntos!"</p>
            
            <div class="stats">
                <div class="stat-bar"><span>Fuerza:</span> <div class="bar"><div class="fill" style="width: 100%;"></div></div></div>
                <div class="stat-bar"><span>Poder Mágico:</span> <div class="bar"><div class="fill" style="width: 95%;"></div></div></div>
                <div class="stat-bar"><span>Amor:</span> <div class="bar"><div class="fill" style="width: 150%; background: #ff003c;"></div></div></div>
            </div>

            <button class="magic-btn" onclick="triggerMagic()">DESATAR HECHIZO</button>

            <audio id="bg-music" loop>
                <source src="music.mp3" type="audio/mpeg">
            </audio>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
