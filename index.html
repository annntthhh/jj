<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimorio de [Su Nombre]</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="magic-overlay"></div>
    
    <div class="grimorio-container">
        <header>
            <div class="clover-icon">♣</div>
            <h1>Grimorio de Caballero Mágico</h1>
        </header>

        <section class="page-content">
            <div class="scroll-decoration"></div>
            <h2 id="title">Propiedad de un Toro Negro</h2>
            <p id="message">"Superar los límites no es una opción, es nuestro camino."</p>
            
            <div class="stats">
                <div class="stat-bar"><span>Magia:</span> <div class="bar"><div class="fill" style="width: 95%;"></div></div></div>
                <div class="stat-bar"><span>Valor:</span> <div class="bar"><div class="fill" style="width: 100%;"></div></div></div>
            </div>

            <button class="magic-btn" onclick="triggerMagic()">Desatar Anti-Magia</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
