<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimorio de Siriu</title>
    <link rel="icon" type="image/png" href="trebol.png">
    <link rel="stylesheet" href="main.css">
</head>
<body onbeforeunload="return despedida()">
    <div class="smoke-overlay"></div>
    
    <div id="loader">
        <img src="escudo.png" alt="Cargando Magia..." class="loader-shield">
        <p>Invocando Grimorio...</p>
    </div>

    <div class="paper-overlay"></div>
    <div class="background-particles"></div>
    
    <div class="flying-pages-container">
        <div class="page-leaf"></div>
        <div class="page-leaf"></div>
        <div class="page-leaf"></div>
    </div>

    <div id="particles-container"></div>

    <div class="grimorio-container">
        <header>
            <div class="clover-header">♣</div>
            <h1>Grimorio de Siriu</h1>
            <p class="subtitle">Orden de los Toros Negros</p>
        </header>

        <section class="page-content">
            <div class="photo-frame">
                <div class="magic-glyphs">
                    <div class="glyph-circle inner"></div>
                    <div class="glyph-circle outer"></div>
                </div>
                <img src="trebol.png" class="clover-img breathing-clover" alt="Trébol de Jesús">
            </div>

            <h2 id="title">Magia de Antigravedad</h2>
            <p id="message">"Siriu, en este reino y en cualquier otro, mi magia siempre te elegirá a ti. ¡Superemos los límites juntos!"</p>
            
            <div class="stats">
                <div class="stat-bar"><span>Fuerza:</span> <div class="bar"><div class="fill" style="width: 100%;"></div></div></div>
                <div class="stat-bar"><span>Poder Mágico:</span> <div class="bar"><div class="fill" style="width: 95%;"></div></div></div>
                <div class="stat-bar"><span>Amor por ti:</span> <div class="bar"><div class="fill" style="width: 200%; background: #ff003c; box-shadow: 0 0 15px #ff003c;"></div></div></div>
            </div>

            <button class="magic-btn pulsing-btn" onclick="triggerMagic()">DESATAR HECHIZO</button>

            <div class="squad-badge">
                <img src="escudo.png" alt="Black Bulls">
            </div>

            <audio id="bg-music" loop>
                <source src="music.mp3" type="audio/mpeg">
            </audio>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
